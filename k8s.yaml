apiVersion: v1
kind: ServiceAccount
metadata:
  name: document-api-sa
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::771826808000:role/document-api-app-service-account-role
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: document-api-config
  namespace: default
data:
  API_VERSION: "1.0.0"
  ENVIRONMENT: "production"
  PORT: "8008"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-api
  namespace: default
  labels:
    app: document-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: document-api
  template:
    metadata:
      labels:
        app: document-api
    spec:
      serviceAccountName: document-api-sa
      containers:
      - name: document-api
        image: 771826808000.dkr.ecr.us-east-1.amazonaws.com/document-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8008
          name: http
          protocol: TCP
        env:
        - name: API_VERSION
          valueFrom:
            configMapKeyRef:
              name: document-api-config
              key: API_VERSION
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: document-api-config
              key: ENVIRONMENT
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: document-api-config
              key: PORT
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8008
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8008
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: document-api-service
  namespace: default
  labels:
    app: document-api
spec:
  type: NodePort
  selector:
    app: document-api
  ports:
  - port: 80
    targetPort: 8008
    protocol: TCP
    name: http